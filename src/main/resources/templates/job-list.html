<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Job Listings</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f5f5f5;
      }
      h1 {
        color: #1f3864;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }
      th {
        background: #1f3864;
        color: white;
      }
      a.button {
        display: inline-block;
        margin-bottom: 20px;
        padding: 10px 16px;
        background: #1f3864;
        color: white;
        text-decoration: none;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Job Listings</h1>
    <a class="button" th:href="@{/jobs/add}">+ Add New Job</a>
    <table>
      <tr>
        <th>Title</th>
        <th>Company</th>
        <th>Location</th>
        <th>Salary</th>
        <th>Description</th>
      </tr>
      <tr th:each="job : ${jobs}">
        <td th:text="${job.title}"></td>
        <td th:text="${job.company}"></td>
        <td th:text="${job.location}"></td>
        <td th:text="${job.salary}"></td>
        <td th:text="${job.description}"></td>
      </tr>
    </table>
  </body>
</html>
